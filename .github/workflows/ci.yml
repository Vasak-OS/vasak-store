# Los chequeos viven en el repositorio `.github` de la organización, así que
# acá sólo se los llama. Cambiarlos es cambiarlos en un solo lugar.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    # Sólo lectura. Estos chequeos clonan, instalan dependencias y comprueban:
    # no comentan, no etiquetan, no publican.
    #
    # El workflow llamado declara lo mismo en su trabajo, que es donde el
    # permiso se aplica; esto lo escribe también acá porque el análisis
    # estático de este repositorio no puede ver el otro archivo, y ahí un
    # trabajo sin `permissions` se lee como permisos por omisión.
    permissions:
      contents: read
    uses: Vasak-OS/.github/.github/workflows/app.yml@main
    # Sólo el token de SonarQube Cloud, y por nombre: `secrets: inherit`
    # le daría también el de crates.io y el de npm a un trabajo que
    # instala dependencias de terceros.
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      # Este repositorio ya está al día con las bibliotecas propias, así
      # que quedarse atrás pasa a cortar en vez de sólo avisar.
      bibliotecas_cortan: true
      # Y el candado también. La línea de arriba decía «ya está al día» siendo
      # falso: el rango pedía `^1.2.0` —que admite la 1.4.0— y `bun.lock` se
      # había quedado en la 1.2.0, así que se empaquetaba ésa con el CI en
      # verde. Ahora que la comprobación existe (Vasak-OS/.github#7), se
      # enciende acá.
      candado_corta: true
      # Las pruebas de Rust corren en `revisar` y de esa misma corrida sale la
      # cobertura que se le pasa a Sonar. Sin esto las pruebas no corrían en
      # ningún PR, y un PR que sólo toca Rust pasaba la puerta sin medir nada
      # (Vasak-OS/.github#25).
      # Sólo el protocolo: el daemon y la aplicación enlazan `libalpm`, que no
      # existe en el runner de Ubuntu. Se prueba lo que compila ahí, sin
      # contenedor de Arch (decisión del 12/10/2026 en Vasak-OS/.github#25).
      pruebas_rust: -p vasak-store-protocol
      # Lo que pide el grafo en Linux, mirado con `cargo tree -i`:
      #
      #   build-essential  el compilador de C de los `-sys`
      paquetes_rust: >-
        build-essential
