<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Quién puede hablar con el servicio de la tienda.

  Sólo root es dueño del nombre, y cualquiera puede mandarle mensajes. Esto
  último suena laxo y no lo es: lo que decide si una operación se hace es
  polkit, no esta política. Cerrar acá por usuario o por grupo sería una
  segunda regla de autorización, escrita en otro archivo y con otra idea de
  quién puede qué, y de las dos la que se puede auditar y configurar es la de
  polkit.

  Lo que sí queda cerrado son los métodos que no existen: un mensaje a una
  interfaz que no está devuelve un error, no pasa de largo.
-->
<busconfig>
  <policy user="root">
    <allow own="ar.net.vasak.os.Store"/>
  </policy>

  <policy context="default">
    <allow send_destination="ar.net.vasak.os.Store"
           send_interface="ar.net.vasak.os.Store"/>
    <allow send_destination="ar.net.vasak.os.Store"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="ar.net.vasak.os.Store"
           send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
