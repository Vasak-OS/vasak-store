_version: 1
# One catalogue per language, with keys grouped by screen or component.
#
# Two rules we learned the hard way:
#
#  1. If a value contains `: `, it goes **in quotes**. Without them the parser
#     reads it as a nested mapping and breaks the whole file — and the plugin
#     panics on start-up, so the application does not open.
#  2. Both languages must have the **same keys** and the same `{0}` markers.
#     There is a test that checks it.
